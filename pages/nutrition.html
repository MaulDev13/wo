<section id="nutrition-page">

  <div class="card-group">

    <!-- Header -->
    <div class="card">
      <h1>Nutrition Reference 🥗</h1>
      <p>Referensi nutrisi esensial untuk pertumbuhan otot — disesuaikan dengan porsi warung Bandung.</p>
      <div style="display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 1rem;">
        <div><strong>~140-160 g</strong><br><small>Protein / hari</small></div>
        <div><strong>~300-400 g</strong><br><small>Karbohidrat / hari</small></div>
        <div><strong>~60-80 g</strong><br><small>Lemak sehat / hari</small></div>
        <div><strong>Tiap makan</strong><br><small>Ada sumber protein</small></div>
      </div>
    </div>

    <div class="button-group">

      <!-- Makronutrien -->
      <button class="button button--primary"
        hx-get="/pages/contents/nutrition/macronutrients.html"
        hx-target="#macronutrients"
        hx-trigger="click once"
        hx-swap="innerHTML"
        onclick="toggleProject(this, 'macronutrients')">
          <span>Maktronutrien</span>
          <span class="arrow">▼</span>
      </button>

      <!-- Mikronutrien -->
      <button class="button button--primary"
        hx-get="/pages/contents/nutrition/micronutrients.html"
        hx-target="#micronutrients"
        hx-trigger="click once"
        hx-swap="innerHTML"
        onclick="toggleProject(this, 'micronutrients')">
          <span>Miktronutrien</span>
          <span class="arrow">▼</span>
      </button>

      <!-- Tabel Kandungan Nutrisi per Makanan -->
      <button class="button button--primary"
        hx-get="/pages/contents/nutrition/nutrition-list.html"
        hx-target="#nutrition-list"
        hx-trigger="click once"
        hx-swap="innerHTML"
        onclick="toggleProject(this, 'nutrition-list')">
          <span>Daftar Nutrisi</span>
          <span class="arrow">▼</span>
      </button>

      <div id="macronutrients" class="project-content hidden"></div>
      <div id="micronutrients" class="project-content hidden"></div>
      <div id="nutrition-list" class="project-content hidden"></div>

    <!-- button group -->
    </div>
     
    

  </div>

  <script src="../js/features/toggle-ui.js"></script>

</section>
