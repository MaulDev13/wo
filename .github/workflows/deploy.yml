name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache bust timestamp
        run: |
          TIMESTAMP=$(date +%s)
          sed -i "s/CACHE_BUST/$TIMESTAMP/" index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "chore: cache bust $TIMESTAMP" || echo "No changes"
          git push origin main